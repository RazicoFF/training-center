server {
    listen 80;
    root /var/www/html/public;

    client_max_body_size 20m;

    # Uploads: served from disk when present, otherwise from the database via
    # upload.php (the disk copy is lost on every redeploy). ^~ keeps the static-file
    # regex below from catching these first.
    location ^~ /uploads/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @upload;
    }

    location @upload {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/upload.php;
    }

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/site.php;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|pdf|mp4|apk|txt)$ {
        try_files $uri =404;
    }

    location ~ ^/admin(/.*)?$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/admin.php;
    }

    location ~ ^/(login|logout|lang|teachers|apply|portal|media|forgot-password)(/.*)?$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/site.php;
    }

    location ~ ^/professions/ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/site.php;
    }

    location = / {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/site.php;
    }

    location / {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }
}
